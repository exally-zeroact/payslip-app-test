<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ここは古い場所です — Kyually（給与明細）</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E7D54">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="icon" type="image/png" href="img/icon-192.png">
<style>
  :root{ --ink:#2E7D54; --muted:#5C7E6C; --line:#d4eae0; --bg:#F0FAF4; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;background:var(--bg);color:var(--ink);
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 22px;max-width:460px;width:100%;
        box-shadow:0 6px 24px rgba(30,60,40,.06);text-align:center;}
  h1{font-size:19px;margin:0 0 10px;}
  p{font-size:14px;line-height:1.8;color:var(--muted);margin:0 0 14px;}
  .go{display:block;padding:14px;border-radius:12px;background:#2E7D54;color:#fff;font-weight:700;text-decoration:none;font-size:15px;}
  .url{font-size:11px;color:#7aa08c;word-break:break-all;margin-top:12px;}
  .note{font-size:12px;color:#8A5A00;background:#FFFBF0;border:1px solid #E5A100;border-radius:10px;padding:10px;margin-top:14px;text-align:left;}
</style>
</head>
<body>
  <div class="card">
    <h1>ここは古い場所です</h1>
    <p>給与明細（Kyually）のテスト用は、新しい場所へ移りました。<br>数秒で自動的に移動します。</p>
    <a class="go" id="go" href="https://exally-zeroact.github.io/exally-staging/kyuyo/">今すぐ新しい場所へ</a>
    <div class="url" id="url"></div>
    <div class="note">★ここを「お気に入り」や「ホーム画面」に登録している場合は、移動先で登録し直してください。
      古い場所は今後は更新されません（新しい直しが入りません）。</div>
  </div>
<script>
(function(){
  var NEW_BASE = 'https://exally-zeroact.github.io/exally-staging/kyuyo/';
  // ★うしろ（?t=... や #...）を落とさない。Web明細のリンクが死ぬため。
  //   古い場所の path（/payslip-app-test/meisai.html など）を、新しい場所の同じファイルへ移す。
  var here = location.pathname.replace(/^\/payslip-app-test\/?/, '');   // 例 'meisai.html' / ''
  if (/^(index\.html)?$/.test(here)) here = '';
  var dest = NEW_BASE + here + location.search + location.hash;
  var a = document.getElementById('go'); a.href = dest;
  document.getElementById('url').textContent = dest;

  // ★端末に住み着く物を先に片付ける。push だけでは古い画面が残るため。
  //   ① 昔のService Workerを登録解除 ② キャッシュを全部消す
  var cleanup = Promise.resolve();
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      cleanup = navigator.serviceWorker.getRegistrations()
        .then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister().catch(function(){}); })); })
        .catch(function(){});
    }
  } catch(e){}
  try {
    if (window.caches && caches.keys) {
      cleanup = cleanup.then(function(){ return caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k).catch(function(){}); })); }); }).catch(function(){});
    }
  } catch(e){}

  // 片付けが終わってから移動（終わらなくても3秒で移動する＝待たせ続けない）
  var moved = false;
  function go(){ if(moved) return; moved = true; location.replace(dest); }
  cleanup.then(function(){ setTimeout(go, 400); }).catch(function(){ setTimeout(go, 400); });
  setTimeout(go, 3000);
})();
</script>
</body>
</html>
